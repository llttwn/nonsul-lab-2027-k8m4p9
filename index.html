<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <title>논술 풀이 연구실 : 조건을 읽고, 풀이를 설계하고, 답안으로</title>
  <!--
  =============================================================================
  [AI / 편집자 필수 지침 : gemini-conversation-guide + 학생 프로필]
  이 파일을 수정하거나 새 대학/문항(세종대, 아주대, 인하대 등)을 추가하는 모든
  편집자(제미나이, ChatGPT, 사람)는 아래 원칙을 반드시 지켜 작성해 주세요.

  1. 학생 현재 수준 (status)
     - 논술 완전 입문, 수능 수학 4등급 수준
     - 미적분과 기하는 개념을 아예 모르는 상태
     - 확률과 통계는 4점 문항을 제외하고 대부분 맞히는 수준
     - 일정: 11/22 동국대, 11/28 광운대, 11/29 세종대, 12/05 아주대, 12/06 인하대
     - 모든 소문항과 문항에 '바로 도전 가능(ready)', '개념 조금 보충(supplement)',
       '선수 개념 여러 개 필요(advanced)' 중 하나를 정확히 분류합니다.

  2. 문체와 어조 (gemini-conversation-guide 핵심)
     - 따뜻하고 친근한 존댓말을 쓰되, 해요체와 니다체를 대략 절반씩 자연스럽게 섞습니다.
       (한 어미로 세 문장 이상 연속해서 쓰지 않습니다.)
     - 미적분, 기하처럼 낯선 개념은 추상적 정의보다 구체적인 장면이나 짧은 예시를
       먼저 보여 준 뒤 원리를 쉽게 풀어 설명합니다.
     - 본문 문장 안에 가운뎃점(·)이나 줄표(—)를 쓰지 않습니다. 열거는 쉼표, 와/과,
       또는 슬래시(/)를 사용합니다.
     - 'A가 아니라 B', '단순한 A를 넘어 B' 같은 습관적 대조와 불필요한 '다만' 단서를
       피하고 핵심을 바로 말합니다.
     - 주석(annot)은 반드시 '먼저 볼 단서 -> 이 조건의 의미 -> 떠올리는 이유 ->
       실제로 할 일 -> 확인할 조건' 순서로 작성합니다.
     - 대학 공식 원문과 확인된 풀이만 수록하며, 확인되지 않은 문항은 추측해 만들지 않습니다.
  =============================================================================
  -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />

  <style>

    .term-link {
      display: inline;
      border-bottom: 1.5px dotted #3b82f6;
      border-radius: 4px;

    /* 분수(\frac)가 포함된 용어 링크는 inline-block으로 감싸 점선 밑줄이 분모를 가로지르지 않도록 처리 */
    .term-link:has(.mfrac) {
      display: inline-block;
      vertical-align: middle;
      line-height: 1.45;
      padding: 0.14rem 0.3rem 0.24rem;
      margin: 0.1rem 0.06rem;
    }
    .term-link.term-c0 { border-bottom-color: #3b82f6; }
    .term-link.term-c0:hover { background-color: #eff6ff; color: #1e3a8a; }
    .term-link.term-c0.active-term { background-color: #dbeafe; color: #1e3a8a; border-bottom-style: solid; border-bottom-color: #2563eb; }

    .term-link.term-c1 { border-bottom-color: #10b981; }
    .term-link.term-c1:hover { background-color: #ecfdf5; color: #065f46; }
    .term-link.term-c1.active-term { background-color: #d1fae5; color: #065f46; border-bottom-style: solid; border-bottom-color: #059669; }

    .term-link.term-c2 { border-bottom-color: #d97706; }
    .term-link.term-c2:hover { background-color: #fffbeb; color: #92400e; }
    .term-link.term-c2.active-term { background-color: #fef3c7; color: #92400e; border-bottom-style: solid; border-bottom-color: #b45309; }

    .term-link.term-c3 { border-bottom-color: #8b5cf6; }
    .term-link.term-c3:hover { background-color: #f5f3ff; color: #5b21b6; }
    .term-link.term-c3.active-term { background-color: #ede9fe; color: #5b21b6; border-bottom-style: solid; border-bottom-color: #7c3aed; }

    .term-link.term-c4 { border-bottom-color: #e11d48; }
    .term-link.term-c4:hover { background-color: #fff1f2; color: #9f1239; }
    .term-link.term-c4.active-term { background-color: #ffe4e6; color: #9f1239; border-bottom-style: solid; border-bottom-color: #e11d48; }
    .terse-list {
      white-space: pre-line;
      line-height: 2.2;
    }
    .annot-trigger {
      display: inline-flex;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #2563eb;
      background: #eff6ff;
      border: 1px solid #dbeafe;
      border-radius: 5px;
      padding: 0.08rem 0.48rem;
      margin-left: 0.35rem;
      cursor: pointer;
      vertical-align: middle;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .annot-trigger:hover, .annot-trigger.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    .linked-block {
      transition: background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .linked-block.highlighted {
      background-color: #eef6ff !important;
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px rgba(49, 130, 246, 0.15);
    }
    .spoiler-box {
      border: 2px dashed #cbd5e1;
      background: #f9fafb;
    }
    .tab-btn {
      position: relative;
      white-space: nowrap;
      transition: color 0.15s ease;
    }
    .tab-btn.active {
      color: var(--accent-dark);
      font-weight: 700;
    }
    .tab-btn.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2.5px;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
    }
    @media print {
      header, aside, #rightPanel, #mobileDrawer, #toastContainer, .no-print { display: none !important; }
      main { width: 100% !important; max-width: 100% !important; padding: 0 !important; }
    }
  </style>
</head>

    function toHagiTitle(t) {

    function fallbackFormatTex(tex) {
      return tex
        .replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, "($1)/($2)")
        .replace(/\\sqrt\{([^{}]+)\}/g, "√($1)")
        .replace(/\\left|\\right/g, "")
        .replace(/\\alpha/g, "α").replace(/\\beta/g, "β").replace(/\\gamma/g, "γ")
        .replace(/\\theta/g, "θ").replace(/\\pi/g, "π").replace(/\\infty/g, "∞")
        .replace(/\\perp/g, "⊥").replace(/\\parallel/g, "∥").replace(/\\angle/g, "∠")
        .replace(/\\neq/g, "≠").replace(/\\le/g, "≤").replace(/\\ge/g, "≥")
        .replace(/\\pm/g, "±").replace(/\\cdot/g, "·").replace(/\\to/g, "→")
        .replace(/\\implies/g, "⇒").replace(/\\sum/g, "∑").replace(/\\int/g, "∫")
        .replace(/\\lim/g, "lim").replace(/\\cos/g, "cos").replace(/\\ln/g, "ln")
        .replace(/\\triangle/g, "△").replace(/\\mathbb\{N\}/g, "ℕ")
        .replace(/\\overrightarrow\{([^{}]+)\}/g, "$1⃗").replace(/\\vec\{([^{}]+)\}/g, "$1⃗")
        .replace(/\\text\{([^{}]+)\}/g, "$1").replace(/\\;/g, " ").replace(/\\,/g, " ")
        .replace(/\\\{/g, "{").replace(/\\\}/g, "}");
    }

    function applyFallbackMath(el) {
      if (!el || window.renderMathInElement) return;
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) {
        if (walker.currentNode.nodeValue && walker.currentNode.nodeValue.includes("$")) {
          nodes.push(walker.currentNode);
        }
      }
      nodes.forEach(n => {
        n.nodeValue = n.nodeValue
          .replace(/\$\$([^$]+)\$\$/g, (_, m) => fallbackFormatTex(m))
          .replace(/\$([^$]+)\$/g, (_, m) => fallbackFormatTex(m));
      });
    }

    function upgradeDisplayMath(str) {
      if (str == null) return "";
      let s = String(str);
      // 1) 디스플레이 수식($$...$$) 내부의 <, >를 HTML 엔티티로 보호
      s = s.replace(/\$\$([\s\S]+?)\$\$/g, (_, inner) => {
        return "$$" + inner.replace(/</g, "&lt;").replace(/>/g, "&gt;") + "$$";
      });
      // 2) 인라인 수식($...$) 내부의 <, >를 HTML 엔티티로 보호 + \sum, \lim, \int, \frac에 \displaystyle 자동 적용
      s = s.replace(/(?<!\$)\$(?!\$)([^$]+?)\$(?!\$)/g, (_, inner) => {
        let safe = inner.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        if (/\\(sum|lim|int|frac|prod)/.test(safe) && !safe.includes("\\displaystyle")) {
          safe = "\\displaystyle " + safe;
        }
        return "$" + safe + "$";
      });
      // 3) 수식 밖 일반 텍스트의 비-HTML '<' (예: <조건>, n(B)<n(U), x<0) 보호
      s = s.replace(/<(?!\/?(?:br|p|div|span|strong|em|b|i|ul|ol|li|sup|sub|table|thead|tbody|tr|th|td|code)\b)/gi, "&lt;");
      return s;
    }

        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function parseTermLinks(str, depth) {
      let localIdx = 0;
      return str.replace(/\[\[([a-zA-Z0-9_]+)\|([^\]]+)\]\]/g, (_, tid, label) => {
        const cIdx = (depth + localIdx) % TERM_PALETTES.length;
        localIdx += 1;
        return `<span class="term-link term-c${cIdx}" data-term-id="${tid}" data-term-depth="${depth}" data-term-color="${cIdx}" data-term-label="${escapeAttr(label)}">${label}</span>`;
      });
    }

    function spaceInlineMath(str) {
      return String(str).replace(/\$([^$\n]+)\$/g, (m, inner) => {
        // 좌표 (x, y) 내부가 아닌 식 나열 쉼표와 화살표에 여유 공간 부여
        let out = inner
          .replace(/\s*\\Rightarrow\s*/g, " \\;\\Rightarrow\\; ")
          .replace(/\s*\\Leftrightarrow\s*/g, " \\;\\Leftrightarrow\\; ")
          .replace(/\s*\\rightarrow\s*/g, " \\;\\rightarrow\\; ");
        // 등식 뒤 쉼표 뒤에 공백 추가 (예: 2ap=\sqrt{3}, ap^2+t=...)
        out = out.replace(/(=[^,]+),\s*(?=[a-zA-Z\\])/g, "$1,\\quad ");
        return "$" + out + "$";
      });
    }

    function formatReadable(text, depth = 0) {
      if (!text) return "";
      let t = upgradeDisplayMath(spaceInlineMath(String(text)));
      t = parseTermLinks(t, depth);
      if (t.includes("\n")) {
        const lines = t.split("\n").map(line => {
          const trimmed = line.trim();
          if (!trimmed) return "";
          if (/^\d+\./.test(trimmed)) return `<p class="pl-4">${trimmed}</p>`;
          if (trimmed.startsWith("→") || trimmed.startsWith("∴")) return `<p class="font-semibold text-[#18181b] mt-1">${trimmed}</p>`;
          return `<p>${trimmed}</p>`;
        }).filter(Boolean);
        return '<div class="prose-lines">' + lines.join("") + '</div>';
      }
      t = t.replace(/\s+(?=\((?:가|나|다|라|ⅰ|ⅱ|ⅲ|iv|단,)\))/g, "<br/>");
      t = t.replace(/\s+(?=①|②|③|④)/g, "<br/>");
      const parts = t.split(/(?<=[.?!])\s+(?![0-9\)\]\}])/);
      if (parts.length <= 1) return t;
      return '<div class="prose-lines">' + parts.map(seg => `<p>${seg}</p>`).join("") + '</div>';
    }

    let katexFallbackArmed = false;
    function renderMath(el) {
      if (!el) return;
      if (window.renderMathInElement) {
        try {
          window.renderMathInElement(el, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ],
            throwOnError: false,
          strict: "ignore"
          });
          return;
        } catch (e) {
          // fallback below
        }
      }
      if (katexFallbackArmed) applyFallbackMath(el);
    }

    function buildScratchSourceHtml(p, active) {
      if (!p || !active) return "";
      const rawSrc = [active.text || "", active.why || "", active.confirmed || "", active.kind || ""].join(" ");
      // Extract meaningful keywords (Korean words >= 2 chars, condition tags, math identifiers)
      const stopWords = new Set(["따라서", "이므로", "때문", "위해", "대한", "에서", "으로", "까지", "모든", "다음", "구함", "확정", "계산", "정리", "이용", "적용", "대입", "비교", "확인", "필요", "가능", "성립", "조건", "문제", "함수", "구간", "값은", "부분", "경우", "가장", "바로", "모두", "각각", "같은", "다른", "이미", "먼저", "다시", "여기", "통해", "가지", "만족", "존재"]);
      const kwSet = new Set();
      // Korean tokens
      (rawSrc.replace(/\[\[[a-zA-Z0-9_]+\|([^\]]+)\]\]/g, "$1").match(/[가-힣]{2,}/g) || []).forEach(w => {
        const clean = w.replace(/(에서|으로|까지|부터|이다|이면|하면|하는|되는|에는|에게|보다|처럼|만큼|은|는|이|가|을|를|의|와|과|도|만|로)$/, "");
        if (clean.length >= 2 && !stopWords.has(clean)) kwSet.add(clean);
      });
      // Condition markers like (가), (나), (다), ①, ②, ③
      (rawSrc.match(/\((?:가|나|다|라|ⅰ|ⅱ|ⅲ)\)|[①②③④]/g) || []).forEach(m => kwSet.add(m));
      // Subquestion markers like (1), (2), [1], [2], (1-1), (2-3)
      const subqRefs = new Set();
      (rawSrc.match(/(?:\(\d+(?:-\d+)?\)|\[\d+(?:-\d+)?\]|\b\d+-\d+\b)/g) || []).forEach(m => subqRefs.add(m.replace(/[\[\]\(\)]/g, "")));
      const linkIdxMatch = String(active.linkId || "").match(/(\d+)$/);
      const linkedIdx = linkIdxMatch ? Number(linkIdxMatch[1]) - 1 : -1;

      // Math identifiers like h(x), f(x), g(x), S(t), a_n, P_n, AB, BC, PQ, AM, FM
      (rawSrc.match(/[a-zA-Z]\([a-zA-Z0-9\-+]+\)|[A-Z]{2,3}\b|[a-zA-Z]_[a-zA-Z0-9]+/g) || []).forEach(m => {
        if (m.length >= 2) kwSet.add(m);
      });

      const keywords = Array.from(kwSet);

      function scoreText(text) {
        if (!text) return { score: 0, matched: [] };
        const matched = [];
        for (const kw of keywords) {
          if (text.includes(kw)) matched.push(kw);
        }
        return { score: matched.length, matched };
      }

      // Highlight matching sentences safely without touching inside $...$ math
      function highlightMatchedSentences(text) {
        if (!text) return "";
        // Split by sentence boundaries outside $...$ (simple & safe: split by newlines or '. ')
        const chunks = String(text).split(/(?<=[.?!])\s+(?![0-9\)\]\}])|\n+/).filter(Boolean);
        return chunks.map(ch => {
          const { score } = scoreText(ch);
          const rendered = upgradeDisplayMath(ch);
          if (score > 0) {
            return `<span class="inline bg-amber-100/90 text-[#18181b] px-1 py-0.5 rounded box-decoration-clone">${rendered}</span>`;
          }
          return `<span class="text-zinc-600">${rendered}</span>`;
        }).join(" ");
      }

      const matchedItems = [];
      const otherItems = [];

      // Evaluate passages
      (p.passages || []).forEach((ps, idx) => {
        const res = scoreText(ps.text + " " + (ps.label || ""));
        const item = { tag: ps.label || `제시문 ${idx + 1}`, html: highlightMatchedSentences(ps.text), score: res.score };
        if (res.score > 0 || (p.passages.length === 1 && matchedItems.length === 0)) {
          matchedItems.push(item);
        } else {
          otherItems.push(item);
        }
      });

      // Evaluate subquestions
      (p.subquestions || []).forEach((sq, idx) => {
        const numClean = String(sq.num || "").replace(/[\[\]\(\)]/g, "");
        const explicitRef = subqRefs.has(numClean) || (subqRefs.size === 0 && idx === linkedIdx);
        const res = scoreText(sq.text);
        const totalScore = res.score + (explicitRef ? 3 : 0);
        const item = { tag: `소문항 ${sq.num}`, html: highlightMatchedSentences(sq.text), score: totalScore };
        if (totalScore > 0) {
          matchedItems.push(item);
        } else {
          otherItems.push(item);
        }
      });

      // Fallback if nothing matched strongly: show first passage + first subq
      if (matchedItems.length === 0) {
        if (p.passages && p.passages[0]) {
          matchedItems.push({ tag: p.passages[0].label || "제시문", html: upgradeDisplayMath(p.passages[0].text), score: 1 });
        }
        if (p.subquestions && p.subquestions[0]) {
          matchedItems.push({ tag: `소문항 ${p.subquestions[0].num}`, html: upgradeDisplayMath(p.subquestions[0].text), score: 1 });
        }
      }

      const showAll = !!state.scratchShowAllSource;
      return `
        <div class="rounded-md bg-[#fffdf5] border border-amber-200 p-3.5 space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-amber-100 text-amber-900">문제 원문 대조</span>
              <span class="text-[11px] font-bold text-amber-900">이 연습지에 쓰인 조건</span>
            </div>
            ${otherItems.length > 0 ? `<button type="button" class="toggle-all-src-btn text-[11px] font-bold text-zinc-500 hover:text-[#18181b]">${showAll ? "관련 부분만 보기" : `나머지 원문 보기 (+${otherItems.length})`}</button>` : ""}
          </div>
          <div class="space-y-2 text-[13px] leading-relaxed">
            ${matchedItems.map(it => `
              <div class="p-2.5 rounded bg-white border border-amber-200/80 space-y-1">
                <div class="text-[10.5px] font-extrabold text-amber-800">${it.tag}</div>
                <div class="prose-math text-[13px] leading-relaxed">${it.html}</div>
              </div>
            `).join("")}
            ${showAll && otherItems.length > 0 ? `
              <div class="pt-1 border-t border-amber-200/60 space-y-1.5">
                ${otherItems.map(it => `
                  <div class="p-2 rounded bg-white/70 border border-zinc-200/80 space-y-0.5">
                    <div class="text-[10px] font-bold text-zinc-400">${it.tag}</div>
                    <div class="prose-math text-[12.5px] text-zinc-500 leading-relaxed">${it.html}</div>
                  </div>
                `).join("")}
              </div>
            ` : ""}
          </div>
        </div>
      `;
    }

    function renderAnnotationPanel() {
      const body = document.getElementById("annotPanelBody");
      const mobileBody = document.getElementById("mobileAnnotBody");
      const pinBadge = document.getElementById("annotPinnedBadge");
      const active = state.pinnedAnnot || state.hoverAnnot;

      if (state.mode === "solo") {
        pinBadge.classList.add("hidden");
        const html = `
          <div class="rounded-lg bg-white border border-zinc-200 p-5 space-y-3.5">

            <button id="unlockFromAnnotBtn" type="button" class="w-full py-2.5 px-3 rounded-md bg-[#18181b] hover:bg-zinc-800 text-white text-xs font-bold transition">해설 공부 모드로 전환</button>

        document.querySelectorAll("#unlockFromAnnotBtn").forEach(b => b.addEventListener("click", () => setMode("study")));

      }

      if (state.termStack.length > 0) {
        pinBadge.textContent = `${state.termStack.length}층 탐색 중`;
        pinBadge.classList.remove("hidden");
        const cardsHtml = [];
        for (let idx = state.termStack.length - 1; idx >= 0; idx--) {
          const entry = state.termStack[idx];
          const item = entry && TERMS[entry.id];
          if (!item) continue;
          const pal = TERM_PALETTES[(entry.colorIdx || 0) % TERM_PALETTES.length];
          const isTop = idx === state.termStack.length - 1;
          const headerText = entry.label || item.label;
          const subTitle = item.label && item.label.trim() !== headerText.trim() ? item.label : "";
          cardsHtml.push(`
            <div class="rounded-lg border p-4 space-y-2 ${isTop ? "shadow-xs" : ""}" style="background-color:${pal.cardBg}; border-color:${isTop ? pal.cardBorder : pal.cardSoftBorder};">
              <div class="flex items-start justify-between gap-2">
                <div class="flex items-center flex-wrap gap-1.5 min-w-0">
                  <span class="text-[10px] font-bold px-1.5 py-0.5 rounded shrink-0" style="background-color:${pal.badgeBg}; color:${pal.badgeText};">${idx + 1}층</span>
                  <span class="text-xs font-extrabold text-[#18181b]">${upgradeDisplayMath(headerText)}</span>
                </div>
                <button type="button" class="close-layer-btn text-xs font-bold text-zinc-400 hover:text-[#18181b] shrink-0 px-1" data-close-depth="${idx}" title="이 층 닫기">×</button>
              </div>
              ${subTitle ? `<div class="text-[11.5px] font-semibold text-zinc-500 pl-0.5">${upgradeDisplayMath(subTitle)}</div>` : ""}
              <div class="text-[13.5px] text-[#27272a] leading-relaxed pl-2.5 border-l-2" style="border-color:${pal.accent};">${formatReadable(item.body, idx + 1)}</div>
            </div>
          `);
        }
        const stackHtml = `
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold text-zinc-500">밑줄을 클릭하면 위쪽에 층이 쌓이고, 다시 클릭하면 닫혀요</span>
              <button type="button" class="clear-stack-btn text-xs font-bold text-zinc-500 hover:text-[#18181b]">전체 닫기</button>
            </div>
            ${cardsHtml.join("")}
          </div>
        `;
        body.innerHTML = stackHtml;
        mobileBody.innerHTML = stackHtml;
        renderMath(body);
        renderMath(mobileBody);
        bindTermLinks(body);
        bindTermLinks(mobileBody);
        syncActiveTermLinks();
        document.querySelectorAll(".clear-stack-btn").forEach(b => b.addEventListener("click", (e) => {
          e.stopPropagation();
          state.termStack = [];
          document.getElementById("mobileAnnotModal").classList.add("hidden");
          renderAnnotationPanel();
          syncActiveTermLinks();
        }));
        document.querySelectorAll(".close-layer-btn").forEach(b => b.addEventListener("click", (e) => {
          e.stopPropagation();
          const d = Number(b.dataset.closeDepth || 0);
          state.termStack = state.termStack.slice(0, d);
          if (state.termStack.length === 0) {
            document.getElementById("mobileAnnotModal").classList.add("hidden");
          }
          renderAnnotationPanel();
          syncActiveTermLinks();
        }));
        return;
      }

      syncActiveTermLinks();

      if (!active) {
        pinBadge.classList.add("hidden");
        const html = `
          <div class="rounded-lg bg-white border border-zinc-200 p-5 space-y-2.5">
            <div class="text-sm font-extrabold text-[#18181b]">이 부분에서 어떤 생각을 할까요?</div>
            <p class="text-[13.5px] text-zinc-600 leading-relaxed">본문의 점선 밑줄이나 <span class="font-bold text-[#2563eb]">설명</span> 버튼을 클릭하면 핵심 이유가 바로 열립니다. 열린 설명 안의 밑줄을 클릭하면 위쪽에 2층, 3층으로 쌓이고, 같은 밑줄을 다시 클릭하면 닫혀요.</p>
          </div>
        `;
        body.innerHTML = html;
        mobileBody.innerHTML = html;
        return;
      }

      if (state.pinnedAnnot) pinBadge.classList.remove("hidden");
      else pinBadge.classList.add("hidden");

      let html = "";
      if (active.type === "scratch") {
        const curProb = PROBLEMS.find(item => item.id === state.selectedId);
        html = `
          <div class="rounded-lg bg-white border border-blue-200 p-5 space-y-4 shadow-xs">
            <div class="text-xs font-extrabold text-[#1b64da]">현장 연습지 / ${active.kind}</div>
            <div class="text-sm text-[#18181b] bg-[#fafafa] border-l-4 border-[#18181b] pl-3.5 py-2.5 rounded-r-xl leading-relaxed">${formatReadable(active.text, 0)}</div>
            ${buildScratchSourceHtml(curProb, active)}
            <div>
              <div class="text-xs font-bold text-zinc-500 mb-1">왜 이렇게 생각하나요?</div>
              <div class="text-sm text-[#27272a] leading-relaxed pl-3 border-l-2 border-zinc-200">${formatReadable(active.why, 0)}</div>
            </div>
            <div class="p-3 rounded-md bg-emerald-50 border border-emerald-200">
              <div class="text-xs font-bold text-emerald-800 mb-1">여기까지 확정한 것</div>
              <div class="text-sm text-emerald-900 leading-relaxed">${formatReadable(active.confirmed, 0)}</div>
            </div>
            <div class="p-3 rounded-md bg-[#fafafa] border border-zinc-200">
              <div class="text-xs font-bold text-zinc-500 mb-1">다음에 구해야 할 것</div>
              <div class="text-sm text-[#18181b] leading-relaxed">${formatReadable(active.remaining, 0)}</div>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-slate-100">
              <button type="button" class="jump-linked-btn text-xs font-bold text-[#1b64da] hover:underline" data-link="${active.linkId}">연결된 답안 보기 →</button>
              ${state.pinnedAnnot ? `<button type="button" class="unpin-annot-btn text-xs font-semibold text-zinc-500 hover:text-[#18181b]">고정 해제</button>` : ""}
            </div>
          </div>
        `;
      } else {
        html = `
          <div class="rounded-lg bg-white border border-blue-200 p-5 space-y-4 shadow-xs">
            <div class="text-xs font-extrabold text-[#1b64da]">${active.source}</div>
            <div class="text-sm text-[#18181b] bg-[#fafafa] border-l-4 border-[#18181b] pl-3.5 py-2.5 rounded-r-xl leading-relaxed">${formatReadable(active.quote, 0)}</div>
            <div class="space-y-3.5 text-sm">
              <div><div class="font-bold text-zinc-500 text-xs mb-1">먼저 볼 단서</div><div class="text-[#18181b] pl-3 border-l-2 border-zinc-200 leading-relaxed">${formatReadable(active.clue)}</div></div>
              <div><div class="font-bold text-zinc-500 text-xs mb-1">이 조건의 의미</div><div class="text-[#27272a] pl-3 border-l-2 border-zinc-200 leading-relaxed">${formatReadable(active.meaning)}</div></div>
              <div><div class="font-bold text-zinc-500 text-xs mb-1">이 생각을 떠올리는 이유</div><div class="text-[#27272a] pl-3 border-l-2 border-zinc-200 leading-relaxed">${formatReadable(active.reason)}</div></div>
              <div><div class="font-bold text-zinc-500 text-xs mb-1">실제로 할 일</div><div class="text-[#27272a] pl-3 border-l-2 border-zinc-200 leading-relaxed">${formatReadable(active.action)}</div></div>
              <div class="p-3.5 rounded-md bg-amber-50 border border-amber-200">
                <div class="font-bold text-amber-800 text-xs mb-1">확인할 조건</div>
                <div class="text-amber-900 leading-relaxed">${formatReadable(active.caution)}</div>
              </div>
            </div>
            ${state.pinnedAnnot ? `<div class="pt-2 border-t border-slate-100 text-right"><button type="button" class="unpin-annot-btn text-xs font-bold text-zinc-500 hover:text-[#18181b]">설명 고정 해제</button></div>` : ""}
          </div>
        `;
      }

      body.innerHTML = html;
      mobileBody.innerHTML = html;
      renderMath(body);
      renderMath(mobileBody);
      bindTermLinks(body);
      bindTermLinks(mobileBody);

      document.querySelectorAll(".unpin-annot-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          state.pinnedAnnot = null;
          state.hoverAnnot = null;
          state.activeLinkId = null;
          document.getElementById("mobileAnnotModal").classList.add("hidden");
          renderAnnotationPanel();
          syncActiveTermLinks();
          applyLinkHighlights();
        });
      });

      document.querySelectorAll(".toggle-all-src-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          state.scratchShowAllSource = !state.scratchShowAllSource;
          renderAnnotationPanel();
        });
      });

      document.querySelectorAll(".jump-linked-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const linkId = btn.dataset.link;
          state.activeLinkId = linkId;
          document.getElementById("mobileAnnotModal").classList.add("hidden");
          applyLinkHighlights();
          const target = document.querySelector(`.solution-block[data-link-id="${linkId}"]`);
          if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
        });
      });
    }

    function applyLinkHighlights() {
      document.querySelectorAll(".linked-block").forEach(el => {
        if (state.activeLinkId && el.dataset.linkId === state.activeLinkId) {
          el.classList.add("highlighted");
        } else {
          el.classList.remove("highlighted");
        }
      });
    }

    function renderPracticeCard(p) {
      const rec = getRecord(p.id);
      const isSolo = state.mode === "solo";
      const memoVal = isSolo ? (rec.soloMemo || "") : (rec.memo || "");
      return `
        <div class="rounded-lg bg-white border border-zinc-200 p-5 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h3 class="text-sm font-extrabold text-[#18181b]">${isSolo ? "이번 시도의 풀이 메모" : "내 연습 기록"}</h3>
              <p class="text-xs text-zinc-500 mt-0.5">${isSolo ? "혼자 풀기 메모는 따로 저장돼요." : "떠올린 생각과 막힌 지점을 내 문장으로 남겨 두세요."}</p>
            </div>
            <div class="flex items-center gap-1.5">
              <span id="timerDisplay" class="font-mono text-sm font-extrabold text-[#18181b] bg-[#f2f4f7] px-3 py-1.5 rounded-md">${formatTime(rec.timerSec || 0)}</span>
              <button id="timerToggleBtn" type="button" class="text-xs font-bold px-3 py-1.5 rounded-md bg-[#e8f3ff] text-[#1b64da] hover:bg-blue-100">${state.timerRunning ? "일시정지" : "시간 재기"}</button>
              <button id="timerResetBtn" type="button" class="text-xs font-semibold px-2.5 py-1.5 rounded-md bg-[#f2f4f7] text-[#4e5968] hover:bg-slate-200">초기화</button>
            </div>
          </div>
          <textarea id="memoTextarea" rows="4" placeholder="핵심 아이디어, 막혔던 조건, 다시 풀 때 기억할 내용을 편하게 적어 두세요." class="w-full text-sm p-3.5 rounded-md border border-zinc-200 bg-[#f9fafb] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#3182f6]/25 leading-relaxed">${memoVal.replace(/</g, "&lt;")}</textarea>
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <label for="statusSelect" class="text-xs font-bold text-[#4e5968]">재풀이 결과:</label>
              <select id="statusSelect" class="text-xs px-3 py-1.5 rounded-md border border-[#d1d6db] bg-white font-bold text-[#18181b]">
                ${Object.entries(STATUS_META).map(([k, v]) => `<option value="${k}" ${rec.status === k ? "selected" : ""}>${v.label}</option>`).join("")}
              </select>
            </div>
            <span class="text-xs text-[#8b95a1]">브라우저에 자동 저장됩니다</span>
          </div>
        </div>
      `;
    }

    function bindPracticeCardEvents(p) {
      const rec = getRecord(p.id);
      const toggleBtn = document.getElementById("timerToggleBtn");
      const resetBtn = document.getElementById("timerResetBtn");
      const display = document.getElementById("timerDisplay");
      const memoEl = document.getElementById("memoTextarea");
      const statusEl = document.getElementById("statusSelect");

      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          if (state.timerRunning) {
            stopTimer();
            toggleBtn.textContent = "시간 재기";
          } else {
            stopTimer();
            state.timerRunning = true;
            toggleBtn.textContent = "일시정지";
            state.timerInterval = setInterval(() => {
              rec.timerSec = (rec.timerSec || 0) + 1;
              if (display) display.textContent = formatTime(rec.timerSec);
              saveRecords();
            }, 1000);
          }
        });
      }
      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          stopTimer();
          rec.timerSec = 0;
          saveRecords();
          if (display) display.textContent = "00:00";
          if (toggleBtn) toggleBtn.textContent = "시간 재기";
        });
      }
      if (memoEl) {
        memoEl.addEventListener("input", () => {
          if (state.mode === "solo") rec.soloMemo = memoEl.value;
          else rec.memo = memoEl.value;
          saveRecords();
        });
      }
      if (statusEl) {
        statusEl.addEventListener("change", () => {
          rec.status = statusEl.value;
          saveRecords();
          renderSidebarList();
          showToast(`학습 상태를 '${STATUS_META[rec.status].label}'(으)로 저장했어요.`);
        });
      }
    }

    function getSchoolRubricTip(school) {

                </div>
                <div class="p-3 rounded-md bg-[#fafafa] border border-zinc-200 text-xs text-zinc-600 leading-relaxed">

                </div>
                <div class="space-y-3">
                  ${(p.solution || []).map((sol, idx) => `
                    <div class="linked-block solution-block p-4 rounded-lg border border-zinc-200 bg-white cursor-pointer hover:border-[#18181b]" data-link-id="${sol.linkId}" data-sol-idx="${idx}">

                        <div class="prose-math prose-indent">

        } else if (state.activeTab === "점검") {
          const checks = p.checklist || [];
          const doneCount = checks.filter((_, i) => rec.checklist && rec.checklist[i]).length;
          bodyHtml = `
            <div class="space-y-5">
              <div class="rounded-lg bg-white border border-zinc-200 p-6 space-y-4">
                <div class="flex items-center justify-between">
                  <h3 class="text-base font-extrabold text-[#18181b]">이 문항에서 놓치기 쉬운 부분</h3>
                  <span class="text-xs font-extrabold text-[#1b64da]">확인 ${doneCount} / ${checks.length}개</span>
                </div>
                <div class="space-y-2.5">
                  ${checks.map((ck, i) => `
                    <label class="flex items-start gap-3 p-3.5 rounded-md bg-[#fafafa] hover:bg-slate-100 cursor-pointer text-sm text-[#333d4b] leading-relaxed">
                      <input type="checkbox" class="check-item mt-1 w-4 h-4 rounded border-slate-300 text-[#3182f6] focus:ring-[#3182f6]" data-check-idx="${i}" ${rec.checklist && rec.checklist[i] ? "checked" : ""} />
                      <span>${upgradeDisplayMath(ck)}</span>
                    </label>
                  `).join("")}
                </div>
                <div class="pt-2 flex flex-wrap gap-2.5">
                  <button id="retrySoloBtn" type="button" class="px-4 py-2.5 rounded-md bg-[#18181b] hover:bg-zinc-800 text-white text-xs font-bold">빈 공간에서 다시 풀기</button>
                  <button id="reviewSolutionBtn" type="button" class="px-4 py-2.5 rounded-md border border-[#d1d6db] bg-white hover:bg-slate-50 text-[#333d4b] text-xs font-bold">제출 답안 돌아보기</button>
                </div>
              </div>
              ${renderPracticeCard(p)}
            </div>
          `;
        }
      }

      main.innerHTML = `
        <!-- 문항 헤더 -->
        <div class="rounded-lg bg-white border border-zinc-200 p-6 space-y-3.5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="text-xs font-bold text-zinc-500">${p.school} / ${p.isPlanned ? "기출 추가 예정" : `${p.year}학년도 / ${p.session} / ${p.number}`}</div>
            ${p.officialUrl ? `<a href="${p.officialUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-xs font-bold text-[#1b64da] hover:underline bg-[#e8f3ff] px-3 py-1.5 rounded-md">공식 원문 PDF ↗</a>` : ""}
          </div>
          <h1 class="text-xl sm:text-2xl font-extrabold text-[#18181b] leading-snug tracking-tight">${upgradeDisplayMath(p.title)}</h1>
          <div class="flex flex-wrap items-center gap-1.5">
            ${(p.subjects || []).map(s => `<span class="text-xs font-bold px-2.5 py-1 rounded-full bg-[#f2f4f7] text-[#4e5968]">${s}</span>`).join("")}
            <span class="text-xs font-bold px-2.5 py-1 rounded-full border ${getAccessBadgeClass(p.accessLevel)}">${p.accessLabel}</span>
            ${!p.isPrivate && !p.isPlanned ? `<span class="text-xs font-bold px-2.5 py-1 rounded-full ${STATUS_META[rec.status].badge}">${STATUS_META[rec.status].label}</span>` : ""}
          </div>
          <p class="prose-math text-[#334155]">${p.summary}</p>
          ${renderCutoffBanner(p.school)}
        </div>

        <!-- 5개 학습 탭 바 -->
        ${!p.isPrivate && !p.isSummaryOnly && !p.isPlanned ? `
          <div class="flex items-center justify-between border-b border-zinc-200 overflow-x-auto no-print">
            <div class="flex items-center gap-1.5">
              ${tabs.map(t => `
                <button type="button" data-tab="${t.id}" class="tab-btn px-3 py-2.5 text-[13px] font-bold text-zinc-500 hover:text-[#18181b] ${state.activeTab === t.id ? "active" : ""}">
                  ${state.mode === "solo" && t.lockedInSolo ? '<svg class="inline w-3.5 h-3.5 mr-1 -mt-0.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>' : ""}${t.label}
                </button>
              `).join("")}
            </div>
            <button id="printBtn" type="button" class="shrink-0 ml-2 text-xs font-bold text-zinc-500 hover:text-[#18181b] px-3 py-2 rounded-md hover:bg-slate-100">인쇄</button>
          </div>
        ` : ""}

        <!-- 탭 본문 -->
        <div id="tabBody">${bodyHtml}</div>
      `;

      renderMath(main);
      bindMainEvents(p);
      applyLinkHighlights();
    }

    function syncActiveTermLinks() {
      document.querySelectorAll(".term-link").forEach(el => {
        if (!state.termStack || state.termStack.length === 0) {
          el.classList.remove("active-term");
          return;
        }
        const tid = el.dataset.termId;
        const depth = Number(el.dataset.termDepth || 0);
        const rawLabel = el.dataset.termLabel || "";
        const cur = state.termStack[depth];
        const isActive = Boolean(cur && cur.id === tid && (cur.label || "") === rawLabel);
        el.classList.toggle("active-term", isActive);
      });
    }

    function bindTermLinks(rootEl) {
      if (!rootEl) return;
      rootEl.querySelectorAll(".term-link").forEach(el => {
        const tid = el.dataset.termId;
        const depth = Number(el.dataset.termDepth || 0);
        const rawLabel = el.dataset.termLabel || "";
        const colorIdx = Number(el.dataset.termColor || 0);
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          if (!TERMS[tid]) return;
          state.pinnedAnnot = null;
          state.hoverAnnot = null;
          const cur = state.termStack[depth];
          const isSameOpen = Boolean(cur && cur.id === tid && (cur.label || "") === rawLabel);
          if (isSameOpen) {
            state.termStack = state.termStack.slice(0, depth);
          } else {
            const next = state.termStack.slice(0, depth);
            next[depth] = { id: tid, label: rawLabel, colorIdx };
            state.termStack = next;
          }
          renderAnnotationPanel();
          syncActiveTermLinks();
          if (state.termStack.length > 0 && window.innerWidth < 1280) {
            document.getElementById("mobileAnnotModal").classList.remove("hidden");
          }
        });
      });
    }

    function bindMainEvents(p) {
      bindTermLinks(document.getElementById("mainContent"));
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.activeTab = btn.dataset.tab;
          state.pinnedAnnot = null;
          state.hoverAnnot = null;
          state.termStack = [];
          state.activeLinkId = null;
          renderMain();
          renderAnnotationPanel();
          syncActiveTermLinks();
          applyLinkHighlights();
        });
      });

      const printBtn = document.getElementById("printBtn");
      if (printBtn) printBtn.addEventListener("click", () => window.print());

      document.querySelectorAll(".annot-trigger").forEach(btn => {
        const group = btn.dataset.annotGroup;
        const idx = Number(btn.dataset.annotIdx);
        let annotData = null;
        if (group === "passage") annotData = p.passages[idx]?.annot;
        else if (group === "subq") annotData = p.subquestions[idx]?.annot;
        else if (group === "sol") annotData = p.solution[idx]?.annot;
        if (!annotData) return;

        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          state.termStack = [];
          state.hoverAnnot = null;
          if (state.pinnedAnnot === annotData) {
            state.pinnedAnnot = null;
          } else {
            state.pinnedAnnot = annotData;
          }
          renderAnnotationPanel();
          syncActiveTermLinks();
          if (state.pinnedAnnot && window.innerWidth < 1280) {
            document.getElementById("mobileAnnotModal").classList.remove("hidden");
          }
        });
      });

      document.querySelectorAll(".scratch-block").forEach(el => {
        const idx = Number(el.dataset.scratchIdx);
        const sc = p.scratchpad[idx];
        el.addEventListener("click", () => {
          state.termStack = [];
          state.hoverAnnot = null;
          if (state.pinnedAnnot && state.pinnedAnnot.type === "scratch" && state.pinnedAnnot.text === sc.text) {
            state.pinnedAnnot = null;
            state.activeLinkId = null;
          } else {
            state.scratchShowAllSource = false; state.pinnedAnnot = { type: "scratch", ...sc };
            state.activeLinkId = sc.linkId;
          }
          renderAnnotationPanel();
          syncActiveTermLinks();
          applyLinkHighlights();
          if (state.pinnedAnnot && window.innerWidth < 1280) {
            document.getElementById("mobileAnnotModal").classList.remove("hidden");
          }
        });
      });

      document.querySelectorAll(".solution-block").forEach(el => {
        el.addEventListener("click", () => {
          state.activeLinkId = el.dataset.linkId;
          applyLinkHighlights();
        });
      });

      document.querySelectorAll(".toggle-quiz-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const box = document.getElementById(`quizAns-${btn.dataset.quizIdx}`);
          if (box) {
            const hidden = box.classList.toggle("hidden");
            btn.textContent = hidden ? "▶ 확인 답 보기" : "▼ 확인 답 접기";
          }
        });
      });

      const toggleRefBtn = document.getElementById("toggleRefProblemBtn");
      if (toggleRefBtn) {
        toggleRefBtn.addEventListener("click", () => {
          state.refProblemOpen = state.refProblemOpen === true ? false : true;
          renderMain();
          syncActiveTermLinks();
          applyLinkHighlights();
        });
      }
      const revBtn = document.getElementById("revealDesignBtn");
      if (revBtn) revBtn.addEventListener("click", () => { state.designRevealed[p.id] = true; renderMain(); syncActiveTermLinks(); });
      const hideBtn = document.getElementById("hideDesignBtn");
      if (hideBtn) hideBtn.addEventListener("click", () => { state.designRevealed[p.id] = false; state.termStack = []; renderMain(); renderAnnotationPanel(); syncActiveTermLinks(); });

      const nextHint = document.getElementById("nextHintBtn") || document.getElementById("soloNextHintBtn");
      if (nextHint) {
        nextHint.addEventListener("click", () => {
          const cur = state.hintsShown[p.id] || 0;
          const total = (p.hints || []).length;
          if (cur < total) {
            state.hintsShown[p.id] = cur + 1;
          } else {
            state.hintsShown[p.id] = 0;
            state.termStack = [];
            renderAnnotationPanel();
          }
          renderMain();
          syncActiveTermLinks();
        });
      }
      const prevHint = document.getElementById("prevHintBtn") || document.getElementById("soloPrevHintBtn");
      if (prevHint) {
        prevHint.addEventListener("click", () => {
          const cur = state.hintsShown[p.id] || 0;
          if (cur > 0) {
            state.hintsShown[p.id] = cur - 1;
            state.termStack = [];
            renderMain();
            renderAnnotationPanel();
            syncActiveTermLinks();
          }
        });
      }
      const closeHints = document.getElementById("closeHintsBtn") || document.getElementById("soloCloseHintsBtn");
      if (closeHints) {
        closeHints.addEventListener("click", () => {
          state.hintsShown[p.id] = 0;
          state.termStack = [];
          renderMain();
          renderAnnotationPanel();
          syncActiveTermLinks();
        });
      }

      const unlockBtn = document.getElementById("unlockStudyModeBtn");
      if (unlockBtn) unlockBtn.addEventListener("click", () => setMode("study"));

      document.querySelectorAll(".check-item").forEach(cb => {
        cb.addEventListener("change", () => {
          const rec = getRecord(p.id);
          if (!rec.checklist) rec.checklist = {};
          rec.checklist[cb.dataset.checkIdx] = cb.checked;
          saveRecords();
          renderMain();
        });
      });

      const retryBtn = document.getElementById("retrySoloBtn");
      if (retryBtn) retryBtn.addEventListener("click", () => setMode("solo"));
      const reviewBtn = document.getElementById("reviewSolutionBtn");
      if (reviewBtn) {
        reviewBtn.addEventListener("click", () => {
          state.mode = "study";
          state.activeTab = "연습지";
          state.termStack = [];
          state.pinnedAnnot = null;
          state.activeLinkId = null;
          updateModeButtons();
          renderMain();
          renderAnnotationPanel();
          syncActiveTermLinks();
          applyLinkHighlights();
        });
      }

      bindPracticeCardEvents(p);
    }

    function updateProseSize(delta) {
      state.proseSize = Math.min(20, Math.max(13.5, state.proseSize + delta));
      document.documentElement.style.setProperty("--prose-size", `${state.proseSize}px`);
      showToast(`본문 글자 크기를 ${state.proseSize}px로 맞췄어요.`);
    }

    function init() {
      loadRecords();
      const hashId = window.location.hash.replace("#", "");
      if (hashId && PROBLEMS.some(p => p.id === hashId)) {
        state.selectedId = hashId;
      }

      initFilters();
      renderExamSchedule();
      updateModeButtons();
      renderSidebarList();
      renderMain();
      renderAnnotationPanel();

      document.getElementById("fontDownBtn").addEventListener("click", () => updateProseSize(-1));
      document.getElementById("fontUpBtn").addEventListener("click", () => updateProseSize(1));
      document.getElementById("modeStudyBtn").addEventListener("click", () => setMode("study"));
      document.getElementById("modeSoloBtn").addEventListener("click", () => setMode("solo"));
      document.getElementById("searchInput").addEventListener("input", (e) => { state.searchQuery = e.target.value; renderSidebarList(); });
      document.getElementById("yearFilter").addEventListener("change", (e) => { state.yearFilter = e.target.value; renderSidebarList(); });
      document.getElementById("sessionFilter").addEventListener("change", (e) => { state.sessionFilter = e.target.value; renderSidebarList(); });
      document.getElementById("accessFilter").addEventListener("change", (e) => { state.accessFilter = e.target.value; renderSidebarList(); });

      document.getElementById("mobileMenuBtn").addEventListener("click", () => { document.getElementById("mobileAnnotModal").classList.add("hidden"); document.getElementById("mobileDrawer").classList.remove("hidden"); });
      document.getElementById("closeMobileDrawer").addEventListener("click", () => document.getElementById("mobileDrawer").classList.add("hidden"));
      document.getElementById("mobileDrawerBackdrop").addEventListener("click", () => document.getElementById("mobileDrawer").classList.add("hidden"));
      document.getElementById("mobileAnnotBtn").addEventListener("click", () => { document.getElementById("mobileDrawer").classList.add("hidden"); document.getElementById("mobileAnnotModal").classList.remove("hidden"); });
      function closeAllAnnotations() {
        state.termStack = [];
        state.pinnedAnnot = null;
        state.hoverAnnot = null;
        state.activeLinkId = null;
        document.getElementById("mobileAnnotModal").classList.add("hidden");
        renderAnnotationPanel();
        syncActiveTermLinks();
        applyLinkHighlights();
      }
      document.getElementById("closeMobileAnnot").addEventListener("click", closeAllAnnotations);
      document.getElementById("mobileAnnotModal").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) closeAllAnnotations();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && (state.termStack.length > 0 || state.pinnedAnnot || !document.getElementById("mobileAnnotModal").classList.contains("hidden"))) {
          closeAllAnnotations();
        }
      });
      document.getElementById("mobileAnnotBackdrop").addEventListener("click", closeAllAnnotations);

      document.getElementById("exportBtn").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(state.records, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `nonsul-lab-records-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("학습 기록 JSON 파일을 내보냈어요.");
      });

      document.getElementById("importInput").addEventListener("change", (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (parsed && typeof parsed === "object") {
              state.records = { ...state.records, ...parsed };
              saveRecords();
              renderSidebarList();
              renderMain();
              showToast("학습 기록을 불러왔습니다.");
            }
          } catch (err) {
            showToast("올바른 JSON 기록 파일이 아니에요.");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      });

      window.addEventListener("hashchange", () => {
        const id = window.location.hash.replace("#", "");
        if (id && id !== state.selectedId && PROBLEMS.some(p => p.id === id)) {
          selectProblem(id);
        }
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      init();
      window.addEventListener("load", () => {
        if (window.renderMathInElement) {
          window.__onKatexLoad();
        } else {
          katexFallbackArmed = true;
          applyFallbackMath(document.getElementById("mainContent"));
          applyFallbackMath(document.getElementById("annotPanelBody"));
          applyFallbackMath(document.getElementById("mobileAnnotBody"));
        }
      });
    });
  </script>
</body>
</html>
