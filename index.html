<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>논술 풀이 연구실 — 조건을 읽고, 풀이를 설계하고, 답안으로</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="window.__onKatexLoad && window.__onKatexLoad()"></script>
  <style>
    :root {
      --navy: #0f1e36;
      --navy-soft: #1a2d4d;
      --surface: #f8fafc;
      --panel-right: #f3f6fa;
      --border: #e2e8f0;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Inter", system-ui, -apple-system, sans-serif;
      background-color: var(--surface);
      color: #0f172a;
      margin: 0;
    }
    .katex { font-size: 1.02em; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.4rem 0; margin: 0.5rem 0; }
    .annot-trigger {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: #2563eb;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 9999px;
      padding: 0.1rem 0.5rem;
      margin-left: 0.35rem;
      cursor: pointer;
      vertical-align: middle;
      transition: all 0.15s ease;
    }
    .annot-trigger:hover, .annot-trigger.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    .linked-block {
      transition: background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .linked-block.highlighted {
      background-color: #eff6ff !important;
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.18);
    }
    .spoiler-box {
      border: 2px dashed #cbd5e1;
      background: #f8fafc;
    }
    .tab-btn {
      position: relative;
      white-space: nowrap;
    }
    .tab-btn.active {
      color: #1d4ed8;
      font-weight: 700;
    }
    .tab-btn.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2.5px;
      background: #2563eb;
      border-radius: 2px 2px 0 0;
    }
    @media print {
      header, aside, #rightPanel, #mobileDrawer, #toastContainer, .no-print { display: none !important; }
      main { width: 100% !important; max-width: 100% !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- 상단 글로벌 헤더 -->
  <header class="bg-[#0f1e36] text-white sticky top-0 z-30 shadow-sm">
    <div class="max-w-[1600px] mx-auto px-4 h-14 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <button id="mobileMenuBtn" type="button" class="lg:hidden p-1.5 rounded-lg hover:bg-white/10 text-slate-200" aria-label="기출 서가 열기">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-bold tracking-tight text-base sm:text-lg truncate">논술 풀이 연구실</span>
            <span class="hidden sm:inline-block text-[11px] bg-white/10 text-blue-200 px-2 py-0.5 rounded-full">2027 대비</span>
          </div>
          <p class="hidden md:block text-[11px] text-slate-300 leading-none mt-0.5">조건을 읽고, 풀이를 설계하고, 답안으로</p>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <div class="inline-flex bg-[#1a2d4d] p-0.5 rounded-lg border border-white/10" role="group" aria-label="학습 모드 전환">
          <button id="modeStudyBtn" type="button" class="px-3 py-1.5 rounded-md text-xs font-semibold transition">해설 공부</button>
          <button id="modeSoloBtn" type="button" class="px-3 py-1.5 rounded-md text-xs font-semibold transition">혼자 풀기</button>
        </div>
        <button id="mobileAnnotBtn" type="button" class="xl:hidden px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-medium text-blue-100">
          해설 창
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 3단 레이아웃 -->
  <div class="max-w-[1600px] w-full mx-auto flex-1 flex min-h-0">
    <!-- 좌측 사이드바: 나의 기출 서가 -->
    <aside id="leftSidebar" class="hidden lg:flex lg:flex-col w-72 shrink-0 bg-white border-r border-slate-200 h-[calc(100vh-3.5rem)] sticky top-14">
      <div class="p-3.5 border-b border-slate-200 space-y-2.5">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800">나의 기출 서가</h2>
          <span id="problemCountLabel" class="text-[11px] text-slate-500"></span>
        </div>
        <div id="schoolTabs" class="flex flex-wrap gap-1"></div>
        <div class="relative">
          <input id="searchInput" type="search" placeholder="문항, 단원, 개념 검색" class="w-full text-xs pl-8 pr-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" />
          <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z"/></svg>
        </div>
        <div class="grid grid-cols-2 gap-1.5">
          <select id="yearFilter" class="text-xs px-2 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:border-blue-500">
            <option value="all">모든 학년도</option>
          </select>
          <select id="sessionFilter" class="text-xs px-2 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:border-blue-500">
            <option value="all">모든 교시</option>
          </select>
        </div>
        <select id="accessFilter" class="w-full text-xs px-2 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-700 focus:outline-none focus:border-blue-500">
          <option value="all">모든 접근성 수준</option>
          <option value="ready">현재 범위로 접근 가능</option>
          <option value="supplement">새 개념 조금 보충</option>
          <option value="advanced">여러 선수 개념 필요</option>
        </select>
      </div>

      <!-- 문항 목록 -->
      <div id="problemList" class="flex-1 overflow-y-auto p-2.5 space-y-1.5"></div>

      <!-- 하단 다가오는 시험 & 기록 관리 -->
      <div class="p-3 border-t border-slate-200 bg-slate-50/80 space-y-2.5">
        <div class="rounded-lg bg-white border border-slate-200 p-2.5">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-[11px] font-bold text-slate-700">다가오는 논술 일정</span>
            <span class="text-[10px] text-slate-400">자연계 수리논술</span>
          </div>
          <div id="examScheduleList" class="grid grid-cols-2 gap-x-2 gap-y-1 text-[11px] text-slate-600"></div>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="exportBtn" type="button" class="flex-1 text-[11px] font-medium py-1.5 px-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 text-slate-700 transition">기록 내보내기</button>
          <label class="flex-1 text-center text-[11px] font-medium py-1.5 px-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 text-slate-700 transition cursor-pointer">
            기록 가져오기
            <input id="importInput" type="file" accept=".json" class="hidden" />
          </label>
        </div>
        <p class="text-[10px] text-slate-400 text-center">학습 기록은 이 브라우저에 자동 저장됩니다.</p>
      </div>
    </aside>

    <!-- 중앙 메인 학습 영역 -->
    <main class="flex-1 min-w-0 px-4 sm:px-6 lg:px-8 py-5 overflow-y-auto">
      <div id="mainContent" class="max-w-4xl mx-auto space-y-5"></div>
    </main>

    <!-- 우측 보조 패널: 한 줄씩 이해하기 -->
    <aside id="rightPanel" class="hidden xl:flex xl:flex-col w-80 2xl:w-96 shrink-0 bg-[#f3f6fa] border-l border-slate-200 h-[calc(100vh-3.5rem)] sticky top-14">
      <div class="p-4 border-b border-slate-200 bg-white/70 flex items-center justify-between">
        <div>
          <h2 class="text-sm font-bold text-slate-800">한 줄씩 이해하기</h2>
          <p class="text-[11px] text-slate-500">단서 → 의미 → 선택 이유 → 할 일</p>
        </div>
        <span id="annotPinnedBadge" class="hidden text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">고정됨</span>
      </div>
      <div id="annotPanelBody" class="flex-1 overflow-y-auto p-4"></div>
    </aside>
  </div>

  <!-- 모바일 좌측 서가 드로어 -->
  <div id="mobileDrawer" class="fixed inset-0 z-40 hidden lg:hidden">
    <div id="mobileDrawerBackdrop" class="absolute inset-0 bg-slate-900/50"></div>
    <div class="relative w-80 max-w-[85vw] h-full bg-white shadow-xl flex flex-col">
      <div class="p-3.5 border-b border-slate-200 flex items-center justify-between bg-[#0f1e36] text-white">
        <span class="font-bold text-sm">나의 기출 서가</span>
        <button id="closeMobileDrawer" type="button" class="p-1 rounded hover:bg-white/10">✕</button>
      </div>
      <div id="mobileSidebarSlot" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
    </div>
  </div>

  <!-- 모바일/태블릿 우측 주석 시트 -->
  <div id="mobileAnnotModal" class="fixed inset-0 z-40 hidden xl:hidden">
    <div id="mobileAnnotBackdrop" class="absolute inset-0 bg-slate-900/40"></div>
    <div class="absolute bottom-0 inset-x-0 max-h-[75vh] bg-[#f3f6fa] rounded-t-2xl shadow-2xl flex flex-col border-t border-slate-200">
      <div class="p-3.5 border-b border-slate-200 bg-white rounded-t-2xl flex items-center justify-between">
        <span class="font-bold text-sm text-slate-800">한 줄씩 이해하기</span>
        <button id="closeMobileAnnot" type="button" class="text-xs px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700">닫기</button>
      </div>
      <div id="mobileAnnotBody" class="flex-1 overflow-y-auto p-4"></div>
    </div>
  </div>

  <!-- 토스트 알림 -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    // =========================================================================
    // [DATA START: 문항 및 일정 데이터]
    // 제미나이 / ChatGPT 어느 쪽에서든 아래 EXAMS, PROBLEMS 배열만 수정하거나
    // 새 대학(세종대, 아주대, 인하대 등) 객체를 추가하면 사이트 전체에 자동 반영됩니다.
    // =========================================================================
    const EXAMS = [
      { school: "동국대", date: "2026-11-22", label: "11.22" },
      { school: "광운대", date: "2026-11-28", label: "11.28" },
      { school: "세종대", date: "2026-11-29", label: "11.29" },
      { school: "아주대", date: "2026-12-05", label: "12.05" },
      { school: "인하대", date: "2026-12-06", label: "12.06" }
    ];

    const PROBLEMS = [
      // ---------------------- 동국대 2026학년도 ----------------------
      {
        id: "dg-2026-1",
        school: "동국대",
        year: 2026,
        session: "자연계열",
        number: "문제 1",
        title: "정팔면체와 정사면체의 이면각, 두 면의 일치",
        officialUrl: "https://ipsi.dongguk.edu/upload/file/20260223163919G9MS7D.PDF#page=43",
        officialPage: "동국대 2026 논술가이드북 p.43",
        subjects: ["기하", "수학 I"],
        accessLevel: "supplement",
        accessLabel: "기하 기본 개념 보충",
        summary: "정팔면체와 정사면체의 공통 모서리 중점에 수선을 내려 단면 삼각형을 만들고, 코사인법칙과 보각 관계로 이면각 및 두 면의 일치를 증명하는 문항입니다.",
        passages: [
          {
            label: "【가】",
            text: "직선 $l$을 공유하는 두 반평면 $\\alpha, \\beta$로 이루어진 도형을 이면각이라 한다. 이때 직선 $l$을 이면각의 변, 두 반평면 $\\alpha, \\beta$를 각각 이면각의 면이라고 한다. 이면각의 변 $l$ 위의 한 점 $O$를 지나고 직선 $l$에 수직인 두 반직선 $OA, OB$를 두 반평면 $\\alpha, \\beta$ 위에 각각 그을 때, $\\angle AOB$의 크기는 점 $O$의 위치에 관계없이 일정하고 이 각의 크기를 이면각의 크기라고 한다.",
            annot: {
              source: "문제 원문 · 제시문 【가】",
              quote: "이면각의 변 l 위의 한 점 O를 지나고 직선 l에 수직인 두 반직선 OA, OB",
              clue: "교선(이면각의 변) $l$에 수직인 두 선분 $OA, OB$",
              meaning: "3차원 공간에서 두 면이 이루는 각을 2차원 평면 삼각형의 각 $\\angle AOB$로 바꿀 수 있다는 정의입니다.",
              reason: "공간도형을 처음 다뤄도 교선 위의 중점을 잡아 수선 두 개만 찾으면 중학 기하·코사인법칙 문제로 바뀝니다.",
              action: "각 소문항마다 먼저 '두 면의 교선'을 찾고, 각 면(정삼각형)에서 교선에 수직인 중선을 그립니다.",
              caution: "아무 두 선분 사이의 각이 아니라 반드시 교선에 '둘 다 수직'인 선분이어야 이면각입니다."
            }
          },
          {
            label: "【나】",
            text: "공간에서 직선 $l$과 평면 $\\alpha$ 위의 모든 직선이 수직일 때, 직선 $l$과 평면 $\\alpha$는 서로 수직이라고 하고, 기호로 $l \\perp \\alpha$와 같이 나타낸다. 이때 직선 $l$을 평면 $\\alpha$의 수선이라 하고, 직선 $l$과 평면 $\\alpha$가 만나는 점 $O$를 수선의 발이라고 한다."
          },
          {
            label: "【다】",
            text: "평면 $\\alpha$와 한 점 $O$에서 만나는 직선 $l$이 있다. 이때 직선 $l$이 평면 $\\alpha$ 위의 점 $O$를 지나는 서로 다른 두 직선 $m, n$과 서로 수직이면 직선 $l$이 평면 $\\alpha$에 수직이다."
          }
        ],
        prompt: "모든 변의 길이가 $1$인 정팔면체 $A\\text{-}BCDE\\text{-}F$와 정사면체 $J\\text{-}GHI$에 대해서 다음 물음에 답하시오.",
        subquestions: [
          {
            num: "(1)",
            text: "정팔면체에서 평면 $ABC$와 평면 $FBC$가 이루는 이면각 중 둔각의 크기를 $\\alpha$라고 할 때 $\\cos\\alpha$의 값을 구하시오.",
            annot: {
              source: "문제 원문 · 소문항 (1)",
              quote: "평면 ABC와 평면 FBC가 이루는 이면각 중 둔각의 크기를 α",
              clue: "공통 변 $BC$와 '둔각' 조건",
              meaning: "두 정삼각형 $ABC, FBC$가 모서리 $BC$를 공유하며, 구할 코사인 값은 음수($\\cos\\alpha < 0$)여야 합니다.",
              reason: "정삼각형에서 밑변 중점 $M$을 잡으면 $AM \\perp BC$, $FM \\perp BC$가 자동으로 성립하기 때문입니다.",
              action: "삼각형 $AMF$의 세 변 $AM, FM, AF$ 길이를 구해 코사인법칙을 적용합니다.",
              caution: "정팔면체 대각선 $AF$ 길이를 $1$로 착각하지 말고 정사각형 $BCDE$의 대각선 $\\sqrt{2}$와 대칭임을 확인하세요."
            }
          },
          {
            num: "(2)",
            text: "정팔면체에서 평면 $ABC$와 평면 $AED$가 이루는 이면각 중 예각의 크기를 $\\beta$라고 할 때 $\\cos\\beta$의 값을 구하시오.",
            annot: {
              source: "문제 원문 · 소문항 (2)",
              quote: "평면 ABC와 평면 AED가 이루는 이면각 중 예각의 크기를 β",
              clue: "공통 모서리가 안 보이고 꼭짓점 $A$만 공유, 대신 $BC \\parallel ED$",
              meaning: "두 평면의 교선 $l$은 점 $A$를 지나면서 $BC$와 $ED$에 평행한 직선입니다.",
              reason: "교선을 직접 눈으로 찾기 어려울 때는 두 면에 각각 들어있는 평행한 두 직선을 먼저 찾습니다.",
              action: "$BC$의 중점 $M$, $ED$의 중점 $Q$를 잡아 $\\triangle MAQ$에서 $\\angle MAQ = \\beta$의 코사인을 구합니다.",
              caution: "예각 $\\beta$를 구하므로 $\\cos\\beta > 0$인지 마지막에 부호를 반드시 점검하세요."
            }
          },
          {
            num: "(3)",
            text: "정사면체에서 평면 $JGH$와 평면 $IGH$가 이루는 이면각 중 예각의 크기를 $\\gamma$라고 할 때 $\\cos\\gamma$의 값을 구하시오.",
            annot: {
              source: "문제 원문 · 소문항 (3)",
              quote: "정사면체에서 평면 JGH와 평면 IGH가 이루는 이면각 중 예각의 크기를 γ",
              clue: "공통 모서리 $GH$와 정삼각형 두 면",
              meaning: "(1)과 완전히 같은 방식으로 $GH$의 중점 $O$를 잡으면 $\\angle JOI = \\gamma$가 됩니다.",
              reason: "변 길이가 모두 $1$이므로 $JO = IO = \\frac{\\sqrt{3}}{2}$, $JI = 1$로 바로 계산할 수 있습니다.",
              action: "삼각형 $JOI$에 코사인법칙을 적용해 $\\cos\\gamma = \\frac{1}{3}$을 얻습니다.",
              caution: "정사면체 이면각 코사인 $\\frac{1}{3}$은 정팔면체 예각과 값이 같습니다."
            }
          },

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");

    }

    function fallbackFormatTex(tex) {
      return tex
        .replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, "($1)/($2)")
        .replace(/\\sqrt\{([^{}]+)\}/g, "√($1)")
        .replace(/\\left|\\right/g, "")
        .replace(/\\alpha/g, "α").replace(/\\beta/g, "β").replace(/\\gamma/g, "γ")
        .replace(/\\theta/g, "θ").replace(/\\pi/g, "π").replace(/\\infty/g, "∞")
        .replace(/\\perp/g, "⊥").replace(/\\parallel/g, "∥").replace(/\\angle/g, "∠")
        .replace(/\\neq/g, "≠").replace(/\\le/g, "≤").replace(/\\ge/g, "≥")
        .replace(/\\pm/g, "±").replace(/\\cdot/g, "·").replace(/\\to/g, "→")
        .replace(/\\implies/g, "⇒").replace(/\\sum/g, "∑").replace(/\\int/g, "∫")
        .replace(/\\lim/g, "lim").replace(/\\cos/g, "cos").replace(/\\ln/g, "ln")
        .replace(/\\triangle/g, "△").replace(/\\mathbb\{N\}/g, "ℕ")
        .replace(/\\overrightarrow\{([^{}]+)\}/g, "$1⃗").replace(/\\vec\{([^{}]+)\}/g, "$1⃗")
        .replace(/\\text\{([^{}]+)\}/g, "$1").replace(/\\;/g, " ").replace(/\\,/g, " ")
        .replace(/\\\{/g, "{").replace(/\\\}/g, "}");
    }

    function applyFallbackMath(el) {
      if (!el || window.renderMathInElement) return;
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) {
        if (walker.currentNode.nodeValue && walker.currentNode.nodeValue.includes("$")) {
          nodes.push(walker.currentNode);
        }
      }
      nodes.forEach(n => {
        n.nodeValue = n.nodeValue.replace(/\$\$([^$]+)\$\$/g, (_, m) => fallbackFormatTex(m))
                                 .replace(/\$([^$]+)\$/g, (_, m) => fallbackFormatTex(m));
      });
    }

    let katexFallbackArmed = false;
    function renderMath(el) {
      if (!el) return;
      if (window.renderMathInElement) {
        try {
          window.renderMathInElement(el, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false }
            ],
            throwOnError: false
          });
          return;
        } catch (e) {
          // fall through
        }
      }
      if (katexFallbackArmed) {
        applyFallbackMath(el);
      }
    }

      const q = state.searchQuery.trim().toLowerCase();
      return PROBLEMS.filter(p => {
        if (state.schoolFilter !== "전체" && p.school !== state.schoolFilter) return false;
        if (state.yearFilter !== "all" && String(p.year) !== state.yearFilter) return false;
        if (state.sessionFilter !== "all" && !p.session.includes(state.sessionFilter)) return false;
        if (state.accessFilter !== "all" && p.accessLevel !== state.accessFilter) return false;
        if (q) {
          const hay = `${p.school} ${p.year} ${p.number} ${p.title} ${p.summary} ${(p.subjects || []).join(" ")} ${p.accessLabel}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

    function bindPracticeCardEvents(p) {
      const rec = getRecord(p.id);
      const toggleBtn = document.getElementById("timerToggleBtn");
      const resetBtn = document.getElementById("timerResetBtn");
      const display = document.getElementById("timerDisplay");
      const memoEl = document.getElementById("memoTextarea");
      const statusEl = document.getElementById("statusSelect");

      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          if (state.timerRunning) {
            stopTimer();
            toggleBtn.textContent = "시간 재기";
          } else {
            stopTimer();
            state.timerRunning = true;
            toggleBtn.textContent = "일시정지";
            state.timerInterval = setInterval(() => {
              rec.timerSec = (rec.timerSec || 0) + 1;
              if (display) display.textContent = formatTime(rec.timerSec);
              saveRecords();
            }, 1000);
          }
        });
      }
      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          stopTimer();
          rec.timerSec = 0;
          saveRecords();
          if (display) display.textContent = "00:00";
          if (toggleBtn) toggleBtn.textContent = "시간 재기";
        });
      }
      if (memoEl) {
        memoEl.addEventListener("input", () => {
          if (state.mode === "solo") rec.soloMemo = memoEl.value;
          else rec.memo = memoEl.value;
          saveRecords();
        });
      }
      if (statusEl) {
        statusEl.addEventListener("change", () => {
          rec.status = statusEl.value;
          saveRecords();
          renderSidebarList();
          showToast(`학습 상태를 '${STATUS_META[rec.status].label}'(으)로 저장했습니다.`);
        });
      }
    }

      document.querySelectorAll(".tab-btn").forEach(btn => {

          state.activeTab = btn.dataset.tab;

          state.hoverAnnot = null;
          state.activeLinkId = null;
          renderMain();
          renderAnnotationPanel();
        });
      });

      const printBtn = document.getElementById("printBtn");
      if (printBtn) printBtn.addEventListener("click", () => window.print());

      // 주석 트리거(원문/답안)
      document.querySelectorAll(".annot-trigger").forEach(btn => {
        const group = btn.dataset.annotGroup;
        const idx = Number(btn.dataset.annotIdx);
        let annotData = null;
        if (group === "passage") annotData = p.passages[idx]?.annot;
        else if (group === "subq") annotData = p.subquestions[idx]?.annot;
        else if (group === "sol") annotData = p.solution[idx]?.annot;
        if (!annotData) return;

        btn.addEventListener("mouseenter", () => {
          if (!state.pinnedAnnot) {
            state.hoverAnnot = annotData;
            renderAnnotationPanel();
          }
        });
        btn.addEventListener("mouseleave", () => {
          if (!state.pinnedAnnot) {
            state.hoverAnnot = null;
            renderAnnotationPanel();
          }
        });
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          state.pinnedAnnot = annotData;
          renderAnnotationPanel();
          if (window.innerWidth < 1280) {
            document.getElementById("mobileAnnotModal").classList.remove("hidden");
          }
        });
      });

      // 연습지-답안 연결 블록
      document.querySelectorAll(".scratch-block").forEach(el => {
        const idx = Number(el.dataset.scratchIdx);
        const sc = p.scratchpad[idx];
        el.addEventListener("mouseenter", () => {
          if (!state.pinnedAnnot) {
            state.hoverAnnot = { type: "scratch", ...sc };
            renderAnnotationPanel();
          }
        });
        el.addEventListener("mouseleave", () => {
          if (!state.pinnedAnnot) {
            state.hoverAnnot = null;
            renderAnnotationPanel();
          }
        });
        el.addEventListener("click", () => {
          state.pinnedAnnot = { type: "scratch", ...sc };
          state.activeLinkId = sc.linkId;
          renderAnnotationPanel();
          applyLinkHighlights();
          if (window.innerWidth < 1280) {
            document.getElementById("mobileAnnotModal").classList.remove("hidden");
          }
        });
      });

      document.querySelectorAll(".solution-block").forEach(el => {
        el.addEventListener("click", () => {
          state.activeLinkId = el.dataset.linkId;
          applyLinkHighlights();
        });
      });

      // 개념 확인 답 토글
      document.querySelectorAll(".toggle-quiz-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const box = document.getElementById(`quizAns-${btn.dataset.quizIdx}`);
          if (box) {
            const hidden = box.classList.toggle("hidden");
            btn.textContent = hidden ? "▶ 확인 답 보기" : "▼ 확인 답 접기";
          }
        });
      });

      // 풀이 설계 펼치기/접기 & 힌트
      const revBtn = document.getElementById("revealDesignBtn");
      if (revBtn) revBtn.addEventListener("click", () => { state.designRevealed[p.id] = true; renderMain(); });
      const hideBtn = document.getElementById("hideDesignBtn");
      if (hideBtn) hideBtn.addEventListener("click", () => { state.designRevealed[p.id] = false; renderMain(); });

      const nextHint = document.getElementById("nextHintBtn") || document.getElementById("soloNextHintBtn");
      if (nextHint) {
        nextHint.addEventListener("click", () => {
          const cur = state.hintsShown[p.id] || 0;
          if (cur < (p.hints || []).length) {
            state.hintsShown[p.id] = cur + 1;
            renderMain();
          }
        });
      }

      const unlockBtn = document.getElementById("unlockStudyModeBtn");
      if (unlockBtn) unlockBtn.addEventListener("click", () => setMode("study"));

      // 체크리스트
      document.querySelectorAll(".check-item").forEach(cb => {
        cb.addEventListener("change", () => {
          const rec = getRecord(p.id);
          if (!rec.checklist) rec.checklist = {};
          rec.checklist[cb.dataset.checkIdx] = cb.checked;
          saveRecords();
          renderMain();
        });
      });

      const retryBtn = document.getElementById("retrySoloBtn");
      if (retryBtn) retryBtn.addEventListener("click", () => setMode("solo"));
      const reviewBtn = document.getElementById("reviewSolutionBtn");
      if (reviewBtn) {
        reviewBtn.addEventListener("click", () => {
          state.mode = "study";
          state.activeTab = "연습지";
          updateModeButtons();
          renderMain();
          renderAnnotationPanel();
        });
      }

      bindPracticeCardEvents(p);
    }

    // 전역 이벤트 초기화
    function init() {
      loadRecords();
      const hashId = window.location.hash.replace("#", "");
      if (hashId && PROBLEMS.some(p => p.id === hashId)) {
        state.selectedId = hashId;
      }

      initFilters();
      renderExamSchedule();
      updateModeButtons();
      renderSidebarList();
      renderMain();
      renderAnnotationPanel();

      document.getElementById("modeStudyBtn").addEventListener("click", () => setMode("study"));
      document.getElementById("modeSoloBtn").addEventListener("click", () => setMode("solo"));
      document.getElementById("searchInput").addEventListener("input", (e) => { state.searchQuery = e.target.value; renderSidebarList(); });
      document.getElementById("yearFilter").addEventListener("change", (e) => { state.yearFilter = e.target.value; renderSidebarList(); });
      document.getElementById("sessionFilter").addEventListener("change", (e) => { state.sessionFilter = e.target.value; renderSidebarList(); });
      document.getElementById("accessFilter").addEventListener("change", (e) => { state.accessFilter = e.target.value; renderSidebarList(); });

      // 모바일 드로어 & 주석 시트
      document.getElementById("mobileMenuBtn").addEventListener("click", () => document.getElementById("mobileDrawer").classList.remove("hidden"));
      document.getElementById("closeMobileDrawer").addEventListener("click", () => document.getElementById("mobileDrawer").classList.add("hidden"));
      document.getElementById("mobileDrawerBackdrop").addEventListener("click", () => document.getElementById("mobileDrawer").classList.add("hidden"));
      document.getElementById("mobileAnnotBtn").addEventListener("click", () => document.getElementById("mobileAnnotModal").classList.remove("hidden"));
      document.getElementById("closeMobileAnnot").addEventListener("click", () => document.getElementById("mobileAnnotModal").classList.add("hidden"));
      document.getElementById("mobileAnnotBackdrop").addEventListener("click", () => document.getElementById("mobileAnnotModal").classList.add("hidden"));

      // 기록 내보내기 / 가져오기
      document.getElementById("exportBtn").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(state.records, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `nonsul-lab-records-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("학습 기록 JSON 파일을 내보냈습니다.");
      });

      document.getElementById("importInput").addEventListener("change", (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (parsed && typeof parsed === "object") {
              state.records = { ...state.records, ...parsed };
              saveRecords();
              renderSidebarList();
              renderMain();
              showToast("학습 기록을 성공적으로 불러왔습니다.");
            }
          } catch (err) {
            showToast("올바른 JSON 기록 파일이 아닙니다.");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      });

      window.addEventListener("hashchange", () => {
        const id = window.location.hash.replace("#", "");
        if (id && id !== state.selectedId && PROBLEMS.some(p => p.id === id)) {
          selectProblem(id);
        }
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      init();
      // KaTeX 로드 완료 시 재렌더, 오프라인/차단 시 경량 수식 폴백 적용
      window.addEventListener("load", () => {
        if (window.renderMathInElement) {
          window.__onKatexLoad();
        } else {
          katexFallbackArmed = true;
          applyFallbackMath(document.getElementById("mainContent"));
          applyFallbackMath(document.getElementById("annotPanelBody"));
          applyFallbackMath(document.getElementById("mobileAnnotBody"));
        }
      });
    });
  </script>
</body>
</html>
